[project]
name = "alphaview-crawler"
version = "0.1.0"
description = "alphaview crawler service: source adapters writing signals to ClickHouse"
requires-python = ">=3.12"
dependencies = [
    "alphaview-common",
    "httpx>=0.27",
]

[tool.uv.sources]
alphaview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_crawler"]
