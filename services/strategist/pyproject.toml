[project]
name = "alphaview-strategist"
version = "0.1.0"
description = "alphaview strategist service: LLM synthesis of startup theses"
requires-python = ">=3.12"
dependencies = [
    "alphaview-common",
    "litellm>=1.50",
]

[tool.uv.sources]
alphaview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_strategist"]
