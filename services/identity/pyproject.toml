[project]
name = "alphaview-identity"
version = "0.1.0"
description = "alphaview identity service: users, workspaces, authentication"
requires-python = ">=3.12"
dependencies = [
    "alphaview-common",
    "uvicorn[standard]>=0.30",
    "email-validator>=2.2",
]

[tool.uv.sources]
alphaview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_identity"]
