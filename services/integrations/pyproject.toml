[project]
name = "alphaview-integrations"
version = "0.1.0"
description = "alphaview integrations service: analytics connectors, OAuth, enrichment worker"
requires-python = ">=3.12"
dependencies = [
    "alphaview-common",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
alphaview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_integrations"]
