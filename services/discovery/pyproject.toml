[project]
name = "alphaview-discovery"
version = "0.1.0"
description = "alphaview discovery service: runs, opportunities, gap engine, workflow orchestration"
requires-python = ">=3.12"
dependencies = [
    "alphaview-common",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
alphaview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_discovery"]
