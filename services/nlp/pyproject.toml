[project]
name = "alphaview-nlp"
version = "0.1.0"
description = "alphaview NLP service: sentiment, intent classification and pain-point clustering"
requires-python = ">=3.12"
dependencies = [
    "alphaview-common",
    "vadersentiment>=3.3.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[tool.uv.sources]
alphaview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_nlp"]
