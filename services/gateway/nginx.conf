worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Only the web BFF (fixed IP) may assert the real client address.
    set_real_ip_from 172.28.0.10;
    real_ip_header X-Forwarded-For;

    upstream identity     { server identity:8000;         keepalive 32; }
    upstream integrations { server integrations-api:8000; keepalive 32; }
    upstream discovery    { server discovery-api:8000;    keepalive 32; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    server {
        listen 8000;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location /auth/          { proxy_pass http://identity; }
        location = /connectors   { proxy_pass http://integrations; }
        location /connections    { proxy_pass http://integrations; }
        location /discovery      { proxy_pass http://discovery; }
        location /opportunities  { proxy_pass http://discovery; }
        location = /sources      { proxy_pass http://discovery; }

        location / {
            default_type application/json;
            return 404 '{"detail":"Not found"}';
        }
    }
}
