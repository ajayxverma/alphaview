worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Only the web BFF (fixed IP) may assert the real client address.
    set_real_ip_from 172.28.0.10;
    real_ip_header X-Forwarded-For;

    # Docker DNS; proxying via variables re-resolves names so recreated/scaled containers are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    server {
        listen 8000;

        set $identity     http://identity:8000;
        set $integrations http://integrations-api:8000;
        set $discovery    http://discovery-api:8000;
        set $strategist   http://strategist-api:8000;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location /auth/          { proxy_pass $identity; }
        location = /connectors   { proxy_pass $integrations; }
        location /connections    { proxy_pass $integrations; }
        location /discovery      { proxy_pass $discovery; }
        location /research/      { proxy_pass $discovery; }
        location /opportunities  { proxy_pass $discovery; }
        location = /sources      { proxy_pass $discovery; }
        location /geo/           { proxy_pass $discovery; }
        location /ai-providers   { proxy_pass $strategist; }
        location /ai-credentials { proxy_pass $strategist; }

        location / {
            default_type application/json;
            return 404 '{"detail":"Not found"}';
        }
    }
}
