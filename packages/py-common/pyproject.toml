[project]
name = "alphaview-common"
version = "0.1.0"
description = "Shared contracts, auth and infrastructure helpers for alphaview services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "redis>=5.0",
    "clickhouse-connect>=0.8",
    "temporalio>=1.7",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaview_common"]
